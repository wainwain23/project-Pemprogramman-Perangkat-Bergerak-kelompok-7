name: warga_siaga
description: Warga Siaga - aplikasi peringatan dini, tanggap darurat, dan pelaporan warga berbasis lokasi untuk seluruh wilayah Indonesia.
publish_to: "none"
version: 0.4.0+4

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  url_launcher: ^6.3.1
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  pdf: ^3.11.1
  excel: ^4.0.6
  share_plus: ^10.1.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
